<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aerial Tree Inspection — Greenlight Ecology</title>
<style>
  :root {
    --green: #2D5A27;
    --green-hover: #3a7232;
    --green-bg: #eef4ee;
    --bg: #f5f7f5;
    --surface: #ffffff;
    --border: #dfe5df;
    --border-strong: #c9d3c9;
    --text: #1a2e1a;
    --muted: #6b7a6b;
    --muted-strong: #495649;
    --success: #15803d;
    --success-bg: #ecfdf5;
    --error: #b91c1c;
    --error-bg: #fef2f2;
    --warning: #b45309;
    --warning-bg: #fef7ed;
    --radius: 10px;
    --radius-sm: 6px;
  }
  
  *, *::before, *::after { box-sizing: border-box; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  
  /* Nav */
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
  }
  .nav-brand img { height: 28px; width: auto; }
  .nav-back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.82rem;
  }
  .nav-back:hover { color: var(--green); }
  
  /* Main */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem;
    padding-bottom: 6rem;
  }
  
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; font-weight: 700; }
  .lede { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  
  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    margin: -1.25rem -1.25rem 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    background: var(--green-bg);
  }
  .card-header:hover { background: #e5eee5; }
  .card-header h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card-header .chev {
    transition: transform 0.2s;
    color: var(--green);
    font-size: 0.7rem;
  }
  .card.collapsed .card-header .chev { transform: rotate(-90deg); }
  .card.collapsed .card-body { display: none; }
  .card.collapsed .card-header { margin-bottom: -1.25rem; border-bottom: 0; border-radius: var(--radius); }
  
  /* Form fields */
  .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.75rem; }
  .field label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted-strong);
  }
  .field label .req { color: var(--error); }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    font: inherit;
    font-size: 16px; /* prevent iOS zoom */
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    transition: border-color 0.15s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field.filled-from-audio input,
  .field.filled-from-audio select,
  .field.filled-from-audio textarea {
    border-color: var(--green);
    background: var(--success-bg);
  }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
  @media (max-width: 600px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .grid-2.keep, .grid-3.keep, .grid-4.keep { grid-template-columns: 1fr 1fr; }
    .grid-4.keep { grid-template-columns: 1fr 1fr; }
  }
  .full { grid-column: 1 / -1; }
  
  /* Section divider */
  .divider {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 1rem 0;
  }
  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 0.6rem;
  }
  
  /* Audio block */
  .audio-block {
    background: var(--green-bg);
    border: 1px solid #c9dcc9;
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .audio-block-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--green);
    margin: 0 0 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .audio-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.75rem 1.1rem;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    min-height: 44px;
  }
  .btn:hover:not(:disabled) { background: var(--green-bg); border-color: var(--green); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .btn.primary:hover:not(:disabled) { background: var(--green-hover); }
  .btn.record { flex: 1; min-width: 160px; }
  .btn.record.recording {
    background: var(--error-bg);
    border-color: var(--error);
    color: var(--error);
  }
  .btn-label { cursor: pointer; }
  .btn-label input[type="file"] { display: none; }
  
  .audio-status {
    font-size: 0.85rem;
    color: var(--muted-strong);
    margin-top: 0.6rem;
    min-height: 1.2em;
  }
  .audio-status.working::before {
    content: "⏳ ";
  }
  .audio-status.success { color: var(--success); }
  .audio-status.error { color: var(--error); }
  
  .transcript {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    font-size: 0.85rem;
    color: var(--muted-strong);
    margin-top: 0.6rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .transcript-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }
  
  .extracted-summary {
    margin-top: 0.6rem;
    font-size: 0.82rem;
    color: var(--muted-strong);
  }
  .extracted-summary .count {
    display: inline-block;
    background: var(--success);
    color: #fff;
    font-weight: 600;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    font-size: 0.75rem;
    margin-right: 0.4rem;
  }
  .extracted-summary .field-names { color: var(--muted); font-size: 0.8rem; }
  
  /* Audio guide */
  .guide-toggle {
    background: none;
    border: 0;
    padding: 0;
    color: var(--green);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.6rem;
  }
  .guide {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem;
    margin-top: 0.6rem;
    font-size: 0.85rem;
  }
  .guide h4 {
    font-size: 0.82rem;
    margin: 0 0 0.4rem;
    color: var(--text);
  }
  .guide ul { margin: 0 0 0.75rem; padding-left: 1.2rem; color: var(--muted-strong); }
  .guide li { margin-bottom: 0.25rem; }
  .guide .warn {
    background: var(--warning-bg);
    border-left: 3px solid var(--warning);
    padding: 0.6rem 0.75rem;
    border-radius: 4px;
    font-size: 0.8rem;
    color: var(--warning);
    margin-bottom: 0.75rem;
  }
  .guide .example {
    background: var(--bg);
    border-radius: 4px;
    padding: 0.6rem 0.75rem;
    font-size: 0.82rem;
    font-style: italic;
    color: var(--muted-strong);
    line-height: 1.6;
  }
  
  /* PRF / Tree nested cards */
  .nested-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 0.75rem;
    background: var(--bg);
  }
  .nested-header {
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    border-radius: var(--radius-sm);
  }
  .nested-header:hover { background: var(--green-bg); }
  .nested-card.open .nested-header { border-bottom: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .nested-header h3, .nested-header h4 {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .nested-body { padding: 1rem; display: none; }
  .nested-card.open .nested-body { display: block; }
  .remove-btn {
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
  }
  .remove-btn:hover { color: var(--error); }
  
  /* Droppings toggle */
  .toggle {
    display: flex;
    gap: 0.4rem;
  }
  .toggle button {
    flex: 1;
    padding: 0.55rem;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted-strong);
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: var(--radius-sm);
  }
  .toggle button.active {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
    font-weight: 600;
  }
  
  /* Photo */
  .photo-preview {
    margin-top: 0.4rem;
    padding: 0.5rem;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .photo-preview img {
    max-width: 100%;
    max-height: 160px;
    border-radius: 4px;
    object-fit: cover;
  }
  
  /* Add buttons */
  .add-btn {
    width: 100%;
    padding: 0.75rem;
    background: transparent;
    border: 1.5px dashed var(--green);
    color: var(--green);
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
  }
  .add-btn:hover { background: var(--green-bg); }
  
  /* Submit */
  .submit-area {
    margin-top: 1.5rem;
  }
  .submit-btn {
    width: 100%;
    padding: 1rem;
    background: var(--green);
    color: #fff;
    border: 0;
    border-radius: var(--radius);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    min-height: 56px;
  }
  .submit-btn:hover:not(:disabled) { background: var(--green-hover); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .status-box {
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    display: none;
  }
  .status-box.show { display: block; }
  .status-box.info { background: var(--green-bg); color: var(--green); }
  .status-box.success { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }
  .status-box.error { background: var(--error-bg); color: var(--error); border: 1px solid #fecaca; }
  .status-box a { color: inherit; font-weight: 600; }
  
  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.75rem;
    text-align: center;
  }
  
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Sticky submit on mobile */
  @media (max-width: 600px) {
    .submit-area {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      padding: 0.75rem 0;
      margin: 1.5rem -1rem -1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      border-top: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <img src="logoImage.png" alt="" onerror="this.style.display='none'" />
    <span>Greenlight Ecology</span>
  </div>
  <a class="nav-back" href="/">← Portfolio</a>
</nav>

<main class="main">
  <h1>Aerial Tree Inspection</h1>
  <p class="lede">Record PRF field notes. Review what the AI extracted. Enter measurements yourself.</p>

  <!-- Survey info -->
  <section class="card">
    <div class="grid-3 keep">
      <div class="field">
        <label>Site name <span class="req">*</span></label>
        <input id="site_name" placeholder="Bluebell Hill" required />
      </div>
      <div class="field">
        <label>Licence no <span class="req">*</span></label>
        <input id="licence_no" placeholder="2025-12120-CL18_BAT" required />
      </div>
      <div class="field">
        <label>Date <span class="req">*</span></label>
        <input type="date" id="survey_date" required />
      </div>
    </div>
  </section>

  <!-- Trees -->
  <div id="treesContainer"></div>
  <button type="button" class="add-btn" id="addTreeBtn">+ Add another tree</button>

  <!-- Submit -->
  <section class="submit-area">
    <button type="button" class="submit-btn" id="submitBtn">Generate draft Excel</button>
    <div class="status-box" id="formStatus"></div>
    <div class="hint">First request may take ~30s if the server has been idle.</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  const API_URL = "https://aerial-inspection-agent.onrender.com";
  // Local dev: change to "http://localhost:8000"

  let treeCounter = 0;
  const recorderState = {}; // treeId -> { mediaRecorder, chunks }

  // ── Helpers ────────────────────────────────────────────────────
  function el(id) { return document.getElementById(id); }
  function setStatus(containerId, kind, html) {
    const c = el(containerId);
    if (!c) return;
    c.className = "status-box show " + kind;
    c.innerHTML = html;
  }
  function clearStatus(containerId) {
    const c = el(containerId);
    if (c) { c.className = "status-box"; c.innerHTML = ""; }
  }
  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
  }
  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  el("survey_date").value = todayISO();

  // ── Tree ───────────────────────────────────────────────────────
  function addTree() {
    treeCounter++;
    const ti = treeCounter;

    const container = el("treesContainer");
    const card = document.createElement("section");
    card.className = "card open";
    card.id = "tree-" + ti;
    card.innerHTML = `
      <div class="card-header" onclick="Greenlight.toggleCard('tree-${ti}')">
        <h2>
          <span class="chev">▼</span>
          Tree <span id="tree-badge-${ti}">#${ti}</span>
        </h2>
        ${ti > 1 ? `<button type="button" class="remove-btn" onclick="Greenlight.removeTree(event, ${ti})">Remove tree</button>` : ""}
      </div>
      <div class="card-body">

        <div class="grid-2">
          <div class="field">
            <label>Tree ref <span class="req">*</span></label>
            <input type="number" id="tree_ref_${ti}" min="1"
              oninput="Greenlight.updateTreeBadge(${ti})" />
          </div>
          <div class="field">
            <label>Overall suitability <span class="req">*</span></label>
            <select id="overall_suit_${ti}">
              <option value="">Select…</option>
              <option>PRF-I</option>
              <option>PRF-M</option>
              <option>Negligible</option>
            </select>
          </div>
          <div class="field">
            <label>Tree species <span class="req">*</span></label>
            <input id="species_${ti}" placeholder="Oak, Ash, Beech…" />
          </div>
          <div class="field">
            <label>Alive / Dead</label>
            <select id="alive_${ti}">
              <option>Alive</option>
              <option>Dead</option>
            </select>
          </div>
          <div class="field">
            <label>Habitat</label>
            <input id="habitat_${ti}" placeholder="Broadleaf, hedgerow…" />
          </div>
          <div class="field">
            <label>What3Words</label>
            <input id="w3w_${ti}" placeholder="filled.count.soap" />
          </div>
          <div class="field">
            <label>Tree form</label>
            <select id="form_${ti}">
              <option>Single stem</option>
              <option>Multi stem</option>
              <option>Coppice</option>
            </select>
          </div>
          <div class="field">
            <label>DBH (cm)</label>
            <input type="number" id="dbh_${ti}" step="0.1" />
          </div>
          <div class="field">
            <label>Tree height (m)</label>
            <input type="number" id="height_${ti}" step="0.1" />
          </div>
        </div>

        <hr class="divider" />
        <p class="section-label">Weather conditions</p>
        <div class="grid-4 keep">
          <div class="field">
            <label>Temp (°C) <span class="req">*</span></label>
            <input type="number" id="temp_${ti}" step="0.1" />
          </div>
          <div class="field">
            <label>Cloud 0–8 <span class="req">*</span></label>
            <input type="number" id="cloud_${ti}" min="0" max="8" />
          </div>
          <div class="field">
            <label>Humidity % <span class="req">*</span></label>
            <input type="number" id="humidity_${ti}" step="0.1" />
          </div>
          <div class="field">
            <label>Wind 0–12 <span class="req">*</span></label>
            <input type="number" id="wind_${ti}" min="0" max="12" />
          </div>
        </div>

        <hr class="divider" />
        <p class="section-label">Potential roost features (PRFs)</p>
        <div id="prfs-${ti}"></div>
        <button type="button" class="add-btn" onclick="Greenlight.addPRF(${ti})">+ Add PRF</button>
      </div>
    `;
    container.appendChild(card);

    // First PRF by default
    addPRF(ti);

    // Scroll into view
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function updateTreeBadge(ti) {
    const ref = el("tree_ref_" + ti)?.value;
    const badge = el("tree-badge-" + ti);
    if (badge) badge.textContent = ref ? "T" + ref : "#" + ti;
  }

  function removeTree(e, ti) {
    e.stopPropagation();
    const node = el("tree-" + ti);
    if (node) node.remove();
    delete recorderState[ti];
  }

  function toggleCard(id) {
    el(id)?.classList.toggle("open");
    // Also handle collapsed class for CSS
    el(id)?.classList.toggle("collapsed");
  }

  // ── PRF ────────────────────────────────────────────────────────
  let prfCounters = {}; // treeId -> current prf count

  function addPRF(ti) {
    if (!prfCounters[ti]) prfCounters[ti] = 0;
    prfCounters[ti]++;
    const pi = prfCounters[ti];

    const container = el("prfs-" + ti);
    if (!container) return;

    const card = document.createElement("div");
    card.className = "nested-card open";
    card.id = `prf-${ti}-${pi}`;
    card.innerHTML = `
      <div class="nested-header" onclick="Greenlight.toggleNested('prf-${ti}-${pi}')">
        <h4><span class="chev">▼</span> PRF ${pi}</h4>
        ${pi > 1 ? `<button type="button" class="remove-btn" onclick="Greenlight.removePRF(event, ${ti}, ${pi})">Remove</button>` : ""}
      </div>
      <div class="nested-body">

        <!-- Audio (primary action) -->
        <div class="audio-block">
          <p class="audio-block-title">🎙 Record field notes for this PRF</p>
          <div class="audio-controls">
            <button type="button" class="btn record" id="rec-${ti}-${pi}"
              onclick="Greenlight.toggleRecording(${ti}, ${pi})">
              Record audio
            </button>
            <label class="btn btn-label">
              Upload file
              <input type="file" accept="audio/*"
                onchange="Greenlight.uploadAudio(${ti}, ${pi}, this)" />
            </label>
          </div>
          <div class="audio-status" id="status-${ti}-${pi}"></div>
          <div id="transcript-wrap-${ti}-${pi}" style="display:none;">
            <div class="transcript-label">Transcript</div>
            <div class="transcript" id="transcript-${ti}-${pi}"></div>
          </div>
          <div id="extracted-${ti}-${pi}" class="extracted-summary" style="display:none;"></div>

          <button type="button" class="guide-toggle"
            onclick="Greenlight.toggleGuide(${ti}, ${pi})">
            📋 What to say in your recording
          </button>
          <div class="guide" id="guide-${ti}-${pi}" style="display:none;">
            <div class="warn">
              <strong>Measurements are not extracted.</strong>
              All dimensions (PRF height, entrance size, depth, width) must be typed in manually below.
            </div>
            <h4>Describe these in your recording</h4>
            <ul>
              <li><strong>Feature type</strong> — woodpecker hole, tear-out, frost crack, snapped limb, wound</li>
              <li><strong>Aspect</strong> — compass direction the feature faces (N, NE, E…)</li>
              <li><strong>Orientation</strong> — upward, downward, horizontal, angled</li>
              <li><strong>Substrate</strong> — smooth, rough, bobbly, waxy, polished, blackened</li>
              <li><strong>Humidity</strong> — dry, damp, wet, mildew present</li>
              <li><strong>Apex shape</strong> — domed, flat, wedge, spire, chambered</li>
              <li><strong>Competitors</strong> — invertebrates, birds, mammals, slugs</li>
              <li><strong>Smell</strong> — none, pleasant, unpleasant</li>
              <li><strong>Bat evidence</strong> — droppings, staining, smell</li>
              <li><strong>Inspection notes</strong> — your full qualitative description</li>
            </ul>
            <h4>Example</h4>
            <div class="example">
              "PRF one — woodpecker hole, east-facing, downward orientation.
              Smooth substrate, seasonally dry inside. Domed apex.
              Invertebrates present, no smell, no droppings. Goes straight into the stem —
              day roost potential at best, open hole with limited depth."
            </div>
          </div>
        </div>

        <!-- Feature details (partly extracted) -->
        <p class="section-label">Feature details</p>
        <div class="grid-2">
          <div class="field" id="field-feat_type_${ti}_${pi}">
            <label>Feature type</label>
            <input id="feat_type_${ti}_${pi}" placeholder="Woodpecker hole" />
          </div>
          <div class="field" id="field-aspect_${ti}_${pi}">
            <label>Aspect</label>
            <input list="aspect-list" id="aspect_${ti}_${pi}" placeholder="E, SE, SW…" />
          </div>
          <div class="field" id="field-orient_${ti}_${pi}">
            <label>Orientation</label>
            <input id="orient_${ti}_${pi}" placeholder="Downward facing" />
          </div>
          <div class="field" id="field-substrate_${ti}_${pi}">
            <label>Substrate</label>
            <input list="substrate-list" id="substrate_${ti}_${pi}" placeholder="Smooth, rough…" />
          </div>
          <div class="field" id="field-smell_${ti}_${pi}">
            <label>Smell</label>
            <input list="smell-list" id="smell_${ti}_${pi}" placeholder="None, unpleasant…" />
          </div>
          <div class="field" id="field-hum_cond_${ti}_${pi}">
            <label>Humidity condition</label>
            <input list="humidity-list" id="hum_cond_${ti}_${pi}" placeholder="Damp, wet…" />
          </div>
          <div class="field" id="field-apex_${ti}_${pi}">
            <label>Apex shape</label>
            <input list="apex-list" id="apex_${ti}_${pi}" placeholder="Domed, flat…" />
          </div>
          <div class="field" id="field-competitors_${ti}_${pi}">
            <label>Competitors</label>
            <input list="competitors-list" id="competitors_${ti}_${pi}" placeholder="Birds, slugs…" />
          </div>
        </div>

        <!-- Evidence -->
        <p class="section-label">Roosting evidence</p>
        <div class="grid-2">
          <div class="field" id="field-droppings_${ti}_${pi}">
            <label>Droppings</label>
            <div class="toggle" id="droppings-${ti}-${pi}">
              <button type="button" class="active" data-val="No"
                onclick="Greenlight.setDroppings(${ti}, ${pi}, 'No')">No</button>
              <button type="button" data-val="Yes"
                onclick="Greenlight.setDroppings(${ti}, ${pi}, 'Yes')">Yes</button>
            </div>
          </div>
          <div class="field" id="field-bat_notes_${ti}_${pi}">
            <label>Bat notes</label>
            <input id="bat_notes_${ti}_${pi}" placeholder="Any bat observations" />
          </div>
        </div>

        <!-- Measurements (manual) -->
        <p class="section-label">Measurements (enter manually)</p>
        <div class="grid-3">
          <div class="field">
            <label>PRF height (m)</label>
            <input type="number" id="prf_height_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>DPH (cm)</label>
            <input type="number" id="dph_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>Entrance H (cm)</label>
            <input type="number" id="ent_h_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>Entrance W (cm)</label>
            <input type="number" id="ent_w_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>Internal W (cm)</label>
            <input type="number" id="int_w_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>Internal D (cm)</label>
            <input type="number" id="int_d_${ti}_${pi}" step="0.1" />
          </div>
          <div class="field">
            <label>Internal H (cm)</label>
            <input type="number" id="int_h_${ti}_${pi}" step="0.1" />
          </div>
        </div>

        <!-- Inspection notes (partly extracted) -->
        <p class="section-label">Inspection notes</p>
        <div class="field" id="field-notes1_${ti}_${pi}">
          <label>Note 1</label>
          <textarea id="notes1_${ti}_${pi}" placeholder="Describe the feature and its roost potential…"></textarea>
        </div>
        <div class="field" id="field-notes2_${ti}_${pi}">
          <label>Note 2 (re-inspection)</label>
          <textarea id="notes2_${ti}_${pi}" rows="2"></textarea>
        </div>
        <div class="field" id="field-notes3_${ti}_${pi}">
          <label>Note 3 (re-inspection)</label>
          <textarea id="notes3_${ti}_${pi}" rows="2"></textarea>
        </div>

        <!-- Photo -->
        <p class="section-label">Photo</p>
        <div class="field">
          <input type="file" accept="image/*" capture="environment"
            id="photo_${ti}_${pi}"
            onchange="Greenlight.previewPhoto(${ti}, ${pi}, this)" />
          <div class="photo-preview" id="photo-prev-${ti}_${pi}">No photo selected</div>
        </div>

        <!-- Assessment (manual) -->
        <hr class="divider" />
        <p class="section-label">Assessment (surveyor only)</p>
        <div class="field">
          <label>PRF suitability <span class="req">*</span></label>
          <select id="prf_suit_${ti}_${pi}">
            <option>PRF-I</option>
            <option selected>PRF-M</option>
            <option>Negligible</option>
            <option>N/A</option>
          </select>
        </div>

      </div>
    `;
    container.appendChild(card);
  }

  function toggleNested(id) {
    el(id)?.classList.toggle("open");
  }

  function removePRF(e, ti, pi) {
    e.stopPropagation();
    el(`prf-${ti}-${pi}`)?.remove();
  }

  function setDroppings(ti, pi, val) {
    const group = el(`droppings-${ti}-${pi}`);
    if (!group) return;
    group.querySelectorAll("button").forEach(b => {
      b.classList.toggle("active", b.dataset.val === val);
    });
  }

  function previewPhoto(ti, pi, input) {
    const preview = el(`photo-prev-${ti}_${pi}`);
    if (!preview) return;
    if (input.files && input.files[0]) {
      const url = URL.createObjectURL(input.files[0]);
      preview.innerHTML = `<img src="${url}" alt="" />`;
    } else {
      preview.textContent = "No photo selected";
    }
  }

  function toggleGuide(ti, pi) {
    const guide = el(`guide-${ti}-${pi}`);
    if (guide) guide.style.display = guide.style.display === "none" ? "block" : "none";
  }

  // ── Audio recording ────────────────────────────────────────────
  function pickMime() {
    const candidates = [
      "audio/webm;codecs=opus",
      "audio/mp4",
      "audio/webm",
      "audio/ogg;codecs=opus",
    ];
    for (const t of candidates) {
      if (typeof MediaRecorder !== "undefined" &&
          MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
    }
    return "";
  }

  function setAudioStatus(ti, pi, kind, msg) {
    const s = el(`status-${ti}-${pi}`);
    if (!s) return;
    s.className = "audio-status" + (kind ? " " + kind : "");
    s.textContent = msg || "";
  }

  async function toggleRecording(ti, pi) {
    const key = `${ti}-${pi}`;
    const rec = recorderState[key];

    if (rec && rec.mediaRecorder && rec.mediaRecorder.state === "recording") {
      rec.mediaRecorder.stop();
      return;
    }

    // Require tree_ref before recording (backend needs it)
    const treeRef = el("tree_ref_" + ti)?.value;
    if (!treeRef) {
      setAudioStatus(ti, pi, "error", "Enter the tree ref first.");
      el("tree_ref_" + ti)?.focus();
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = pickMime();
      const options = mime ? { mimeType: mime } : {};
      const mr = new MediaRecorder(stream, options);
      const chunks = [];

      mr.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const btn = el(`rec-${ti}-${pi}`);
        if (btn) { btn.classList.remove("recording"); btn.textContent = "Record audio"; }
        const type = mr.mimeType || mime || "audio/webm";
        const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
        const blob = new Blob(chunks, { type });
        const file = new File([blob], `recording.${ext}`, { type });
        await processAudio(ti, pi, file);
      };

      recorderState[key] = { mediaRecorder: mr, chunks };
      mr.start();

      const btn = el(`rec-${ti}-${pi}`);
      if (btn) { btn.classList.add("recording"); btn.textContent = "Stop recording"; }
      setAudioStatus(ti, pi, "", "Recording… tap again to stop.");

    } catch (err) {
      setAudioStatus(ti, pi, "error", "Microphone access denied. Use Upload file instead.");
    }
  }

  async function uploadAudio(ti, pi, input) {
    if (!input.files || !input.files[0]) return;
    await processAudio(ti, pi, input.files[0]);
    input.value = "";
  }

  async function processAudio(ti, pi, file) {
    const treeRef = el("tree_ref_" + ti)?.value;
    if (!treeRef) {
      setAudioStatus(ti, pi, "error", "Enter the tree ref first.");
      return;
    }
    setAudioStatus(ti, pi, "working", "Transcribing and extracting…");

    const fd = new FormData();
    fd.append("audio", file);
    fd.append("tree_ref", treeRef);
    fd.append("prf_number", pi);

    try {
      const res = await fetch(`${API_URL}/audio`, { method: "POST", body: fd });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = body.detail || {};
        const stage = detail.stage ? `${detail.stage}: ` : "";
        const msg = detail.message || JSON.stringify(body);
        setAudioStatus(ti, pi, "error", `${stage}${msg}`);
        return;
      }
      const { transcript, extracted_fields } = body;
      if (!transcript || !transcript.trim()) {
        setAudioStatus(ti, pi, "error", "No speech detected — try again in a quieter spot.");
        return;
      }

      // Show transcript
      el(`transcript-${ti}-${pi}`).textContent = transcript;
      el(`transcript-wrap-${ti}-${pi}`).style.display = "block";

      // Fill form fields and highlight which came from audio
      const filled = applyExtracted(ti, pi, extracted_fields || {});

      // Summary
      const summaryEl = el(`extracted-${ti}-${pi}`);
      if (filled.length > 0) {
        summaryEl.innerHTML = `
          <span class="count">${filled.length} field${filled.length === 1 ? "" : "s"} extracted</span>
          <span class="field-names">${filled.map(esc).join(", ")}</span>
        `;
        summaryEl.style.display = "block";
      } else {
        summaryEl.innerHTML = `<span class="field-names">Nothing recognised. Fill in manually.</span>`;
        summaryEl.style.display = "block";
      }

      setAudioStatus(ti, pi, "success", "✓ Review the highlighted fields below.");
    } catch (err) {
      setAudioStatus(ti, pi, "error", "Network error: " + err.message);
    }
  }

  function applyExtracted(ti, pi, fields) {
    const filled = [];

    function setVal(inputId, fieldId, value, label) {
      if (value == null || value === "") return;
      const input = el(inputId);
      if (!input) return;
      input.value = value;
      const wrapper = el(fieldId);
      if (wrapper) wrapper.classList.add("filled-from-audio");
      filled.push(label || inputId);
    }

    // Text inputs
    setVal(`feat_type_${ti}_${pi}`, `field-feat_type_${ti}_${pi}`, fields.feature_type, "feature type");
    setVal(`aspect_${ti}_${pi}`, `field-aspect_${ti}_${pi}`, fields.aspect, "aspect");
    setVal(`orient_${ti}_${pi}`, `field-orient_${ti}_${pi}`, fields.orientation, "orientation");
    setVal(`substrate_${ti}_${pi}`, `field-substrate_${ti}_${pi}`, fields.substrate, "substrate");
    setVal(`smell_${ti}_${pi}`, `field-smell_${ti}_${pi}`, fields.smell, "smell");
    setVal(`hum_cond_${ti}_${pi}`, `field-hum_cond_${ti}_${pi}`, fields.humidity_condition, "humidity");
    setVal(`apex_${ti}_${pi}`, `field-apex_${ti}_${pi}`, fields.apex_shape, "apex shape");
    setVal(`competitors_${ti}_${pi}`, `field-competitors_${ti}_${pi}`, fields.competitors, "competitors");
    setVal(`bat_notes_${ti}_${pi}`, `field-bat_notes_${ti}_${pi}`, fields.bat_notes, "bat notes");
    setVal(`notes1_${ti}_${pi}`, `field-notes1_${ti}_${pi}`, fields.inspection_notes_1, "note 1");
    setVal(`notes2_${ti}_${pi}`, `field-notes2_${ti}_${pi}`, fields.inspection_notes_2, "note 2");
    setVal(`notes3_${ti}_${pi}`, `field-notes3_${ti}_${pi}`, fields.inspection_notes_3, "note 3");

    // Droppings (boolean)
    if (fields.droppings === true || fields.droppings === false) {
      setDroppings(ti, pi, fields.droppings ? "Yes" : "No");
      const wrapper = el(`field-droppings_${ti}_${pi}`);
      if (wrapper) wrapper.classList.add("filled-from-audio");
      filled.push("droppings");
    }

    return filled;
  }

  // ── Form submission ────────────────────────────────────────────
  function readTree(ti) {
    const treeRef = parseInt(el("tree_ref_" + ti).value, 10);
    const overallSuit = el("overall_suit_" + ti).value;
    const species = el("species_" + ti).value.trim();
    const temp = el("temp_" + ti).value;
    const cloud = el("cloud_" + ti).value;
    const humidity = el("humidity_" + ti).value;
    const wind = el("wind_" + ti).value;

    if (!treeRef || !overallSuit || !species || temp === "" || cloud === "" || humidity === "" || wind === "") {
      throw new Error(`Tree ${ti}: fill in all required fields (ref, suitability, species, weather).`);
    }

    const prfs = [];
    const prfNodes = el("prfs-" + ti)?.querySelectorAll(".nested-card") || [];
    prfNodes.forEach(node => {
      const pi = node.id.split("-")[2];
      const droppingsGroup = el(`droppings-${ti}-${pi}`);
      const active = droppingsGroup?.querySelector("button.active");
      const droppings = active?.dataset.val === "Yes";

      prfs.push({
        prf_number: parseInt(pi, 10),
        prf_height_m: num("prf_height_" + ti + "_" + pi),
        dph_cm: num("dph_" + ti + "_" + pi),
        entrance_height_cm: num("ent_h_" + ti + "_" + pi),
        entrance_width_cm: num("ent_w_" + ti + "_" + pi),
        internal_width_cm: num("int_w_" + ti + "_" + pi),
        internal_depth_cm: num("int_d_" + ti + "_" + pi),
        internal_height_cm: num("int_h_" + ti + "_" + pi),
        feature_type: str("feat_type_" + ti + "_" + pi),
        aspect: str("aspect_" + ti + "_" + pi),
        orientation: str("orient_" + ti + "_" + pi),
        droppings,
        bat_notes: str("bat_notes_" + ti + "_" + pi),
        smell: str("smell_" + ti + "_" + pi),
        substrate: str("substrate_" + ti + "_" + pi),
        humidity_condition: str("hum_cond_" + ti + "_" + pi),
        apex_shape: str("apex_" + ti + "_" + pi),
        competitors: str("competitors_" + ti + "_" + pi),
        prf_suitability: el("prf_suit_" + ti + "_" + pi).value,
        inspection_notes_1: str("notes1_" + ti + "_" + pi),
        inspection_notes_2: str("notes2_" + ti + "_" + pi),
        inspection_notes_3: str("notes3_" + ti + "_" + pi),
      });
    });

    return {
      site_name: el("site_name").value.trim(),
      licence_no: el("licence_no").value.trim(),
      tree_ref: treeRef,
      overall_suitability: overallSuit,
      date: el("survey_date").value,
      habitat: str("habitat_" + ti) || "",
      w3w: str("w3w_" + ti),
      tree_species: species,
      tree_alive: el("alive_" + ti).value,
      dbh_cm: num("dbh_" + ti),
      tree_height_m: num("height_" + ti),
      tree_form: el("form_" + ti).value,
      temperature: parseFloat(temp),
      cloud_cover: parseInt(cloud, 10),
      humidity_pct: parseFloat(humidity),
      wind: parseInt(wind, 10),
      prfs,
    };
  }

  function num(id) {
    const v = el(id)?.value;
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  function str(id) {
    const v = el(id)?.value;
    if (v == null) return null;
    const t = String(v).trim();
    return t === "" ? null : t;
  }

  function genUUID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  async function submit() {
    clearStatus("formStatus");

    // Validate globals
    const siteName = el("site_name").value.trim();
    const licenceNo = el("licence_no").value.trim();
    const date = el("survey_date").value;
    if (!siteName || !licenceNo || !date) {
      setStatus("formStatus", "error", "Please fill in Site name, Licence no and Date.");
      el("site_name").focus();
      return;
    }

    const treeCards = document.querySelectorAll("#treesContainer .card");
    if (!treeCards.length) {
      setStatus("formStatus", "error", "Add at least one tree.");
      return;
    }

    // Build trees payload
    const trees = [];
    try {
      for (const card of treeCards) {
        const ti = card.id.split("-")[1];
        trees.push(readTree(ti));
      }
    } catch (e) {
      setStatus("formStatus", "error", e.message);
      return;
    }

    // Generate survey_id client-side (needed for photo paths)
    const surveyId = genUUID();

    const btn = el("submitBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Generating draft Excel…';
    setStatus("formStatus", "info", "Uploading photos and generating Excel. First request can take ~30s…");

    try {
      // Upload photos (if any) — attaches photo_path to the right PRF
      for (const card of treeCards) {
        const ti = card.id.split("-")[1];
        const treeRef = parseInt(el("tree_ref_" + ti).value, 10);
        const prfNodes = el("prfs-" + ti)?.querySelectorAll(".nested-card") || [];
        for (const node of prfNodes) {
          const pi = node.id.split("-")[2];
          const photoInput = el(`photo_${ti}_${pi}`);
          if (!photoInput?.files?.length) continue;
          const fd = new FormData();
          fd.append("photo", photoInput.files[0]);
          const r = await fetch(`${API_URL}/photos/${surveyId}/${treeRef}/${pi}`, { method: "POST", body: fd });
          if (!r.ok) throw new Error(`Photo upload failed (${r.status})`);
          const { photo_path } = await r.json();
          const tree = trees.find(t => t.tree_ref === treeRef);
          const prf = tree?.prfs.find(p => p.prf_number === parseInt(pi, 10));
          if (prf) prf.photo_path = photo_path;
        }
      }

      // Submit survey
      const res = await fetch(`${API_URL}/survey`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ survey_id: surveyId, trees }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = body.detail || `Server error ${res.status}`;
        throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
      }

      // Download
      const dlRes = await fetch(`${API_URL}/report/${body.survey_id}/download`);
      if (!dlRes.ok) throw new Error("Failed to download generated Excel.");
      const blob = await dlRes.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${siteName.replace(/\s+/g, "_")}_Inspection.xlsm`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      setStatus("formStatus", "success",
        `✓ Excel generated and downloaded. You can close this tab.<br><small style="opacity:0.7">Download this file now — the demo doesn't keep files long-term.</small>`);

    } catch (err) {
      setStatus("formStatus", "error", "Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Generate draft Excel";
    }
  }

  // ── Wire up ────────────────────────────────────────────────────
  el("addTreeBtn").addEventListener("click", addTree);
  el("submitBtn").addEventListener("click", submit);

  // Start with one tree
  addTree();

  // Expose handlers used by inline onclick
  window.Greenlight = {
    addTree,
    addPRF,
    updateTreeBadge,
    removeTree,
    removePRF,
    toggleCard,
    toggleNested,
    toggleRecording,
    uploadAudio,
    setDroppings,
    previewPhoto,
    toggleGuide,
  };
})();
</script>

<!-- Datalists for free-text fields with suggestions -->
<datalist id="aspect-list">
  <option>N</option><option>NE</option><option>E</option><option>SE</option>
  <option>S</option><option>SW</option><option>W</option><option>NW</option>
</datalist>
<datalist id="substrate-list">
  <option>Smooth</option><option>Bobbly</option><option>Bumpy</option><option>Rough</option>
  <option>Clean</option><option>Waxy</option><option>Blackened</option><option>Polished</option>
  <option>Dirty</option><option>Dusty</option><option>Debris</option><option>Sludgy</option>
</datalist>
<datalist id="smell-list">
  <option>None</option><option>Pleasant</option><option>Not unpleasant</option><option>Unpleasant</option>
</datalist>
<datalist id="humidity-list">
  <option>Dry</option><option>Damp</option><option>Wet</option><option>Mildew</option>
  <option>Seasonally damp</option>
</datalist>
<datalist id="apex-list">
  <option>Domed</option><option>Spire</option><option>Peak/Wedge</option><option>Flat</option>
  <option>Chambered</option><option>Tube</option>
